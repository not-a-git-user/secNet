<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>secNet Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; font-size: 14px; background: #111; color: #ddd; height: 100vh; display: flex; flex-direction: column; }

    #login { padding: 20px; max-width: 400px; margin: 80px auto; }
    #login h2 { margin-bottom: 12px; }
    #login button { padding: 6px 16px; cursor: pointer; }
    #loginStatus { margin-top: 8px; color: #aaa; }

    #app { display: none; flex: 1; flex-direction: row; overflow: hidden; }

    /* Sidebar */
    #sidebar { width: 220px; border-right: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-section { padding: 6px 8px; font-size: 11px; color: #888; text-transform: uppercase; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-section button { font-size: 11px; background: none; border: 1px solid #444; color: #aaa; cursor: pointer; padding: 1px 5px; }
    #channelList { flex: 1; overflow-y: auto; }
    .channel-item { padding: 5px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .channel-item:hover { background: #1e1e1e; }
    .channel-item.active { background: #2a2a2a; color: #fff; }
    .channel-item.dm::before { content: "@ "; color: #888; }
    .channel-item.group::before { content: "# "; color: #888; }

    /* Main chat area */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #chatHeader { padding: 6px 12px; border-bottom: 1px solid #333; color: #aaa; font-size: 12px; display: flex; justify-content: space-between; }
    #messages { flex: 1; overflow-y: auto; padding: 10px 12px; }
    .msg { margin-bottom: 4px; word-break: break-all; }
    .msg .sender { color: #7af; font-weight: bold; margin-right: 4px; }
    .msg .file-link { color: #aef; text-decoration: underline; cursor: pointer; }
    #inputArea { padding: 8px 12px; border-top: 1px solid #333; display: flex; gap: 6px; align-items: center; }
    #inputArea input[type=text] { flex: 1; background: #1a1a1a; border: 1px solid #444; color: #ddd; padding: 5px 8px; font-family: monospace; font-size: 13px; }
    #inputArea button { padding: 5px 10px; cursor: pointer; background: #222; border: 1px solid #444; color: #ccc; font-size: 13px; }
    #inputArea input[type=file] { display: none; }
    #status { padding: 3px 12px; font-size: 11px; color: #666; border-top: 1px solid #222; min-height: 20px; }

    /* Directory panel */
    #dirPanel { width: 180px; border-left: 1px solid #333; overflow-y: auto; font-size: 12px; }
    #dirPanel .dir-header { padding: 6px 8px; font-size: 11px; color: #888; text-transform: uppercase; border-bottom: 1px solid #222; }
    .dir-entry { padding: 4px 8px; border-bottom: 1px solid #1a1a1a; cursor: pointer; }
    .dir-entry:hover { background: #1e1e1e; }
    .dir-entry .online { color: #4c4; }
    .dir-entry .offline { color: #666; }

    /* Modals */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 100; }
    .modal.open { display: flex; }
    .modal-box { background: #1a1a1a; border: 1px solid #444; padding: 20px; min-width: 320px; max-width: 440px; }
    .modal-box h3 { margin-bottom: 12px; }
    .modal-box input[type=text] { width: 100%; background: #111; border: 1px solid #444; color: #ddd; padding: 5px 8px; font-family: monospace; margin-bottom: 10px; }
    .modal-box label { display: block; margin-bottom: 4px; font-size: 12px; }
    .modal-box .member-list { max-height: 200px; overflow-y: auto; border: 1px solid #333; padding: 6px; margin-bottom: 10px; }
    .modal-box .member-list label { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
    .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; }
    .modal-buttons button { padding: 4px 14px; cursor: pointer; background: #222; border: 1px solid #444; color: #ccc; font-family: monospace; }

    /* Profile bar at bottom of sidebar */
    #profileBar { padding: 6px 8px; border-top: 1px solid #333; font-size: 11px; color: #666; }
    #profileBar input[type=text] { width: 100%; background: #111; border: 1px solid #333; color: #aaa; padding: 3px 5px; font-family: monospace; font-size: 11px; margin-top: 3px; }
  </style>
</head>
<body>

<!-- Login -->
<div id="login">
  <h2>secNet</h2>
  <button id="loginButton">Connect</button>
  <div id="loginStatus"></div>
</div>

<!-- Main app -->
<div id="app">
  <!-- Sidebar: channels + DMs -->
  <div id="sidebar">
    <div class="sidebar-section">
      Channels
      <button id="newGroupBtn" title="New group">+</button>
    </div>
    <div id="channelList"></div>
    <div id="profileBar">
      <div id="myTag" style="color:#888"></div>
      <input type="text" id="usernameInput" placeholder="set username" title="Press Enter to save">
    </div>
  </div>

  <!-- Chat area -->
  <div id="main">
    <div id="chatHeader">
      <span id="chatTitle">—</span>
      <span id="chatMeta"></span>
    </div>
    <div id="messages"></div>
    <div id="inputArea">
      <input type="text" id="textInput" placeholder="message…" autocomplete="off">
      <button id="attachBtn" title="Attach file">📎</button>
      <input type="file" id="fileInput">
      <button id="sendBtn">Send</button>
    </div>
    <div id="status"></div>
  </div>

  <!-- Directory -->
  <div id="dirPanel">
    <div class="dir-header">Directory</div>
    <div id="dirList"></div>
  </div>
</div>

<!-- New group modal -->
<div class="modal" id="newGroupModal">
  <div class="modal-box">
    <h3>New Group</h3>
    <label>Name</label>
    <input type="text" id="groupNameInput" placeholder="group name" maxlength="64">
    <label>Members</label>
    <div class="member-list" id="memberCheckboxes"></div>
    <div class="modal-buttons">
      <button id="cancelGroupBtn">Cancel</button>
      <button id="createGroupBtn">Create</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
